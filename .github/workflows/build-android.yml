name: Build signed EchoTrace Android
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Build, sign and publish the APK (false = only apply and commit source)'
        default: 'true'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Prepare installed Android SDK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-33" "build-tools;33.0.2"
      - name: Apply reviewed source (idempotent)
        run: |
          if [ -d release-payload ]; then
            cat release-payload/part* | base64 -d | gunzip > /tmp/v120.patch
            git apply --index /tmp/v120.patch
            git rm -rq --ignore-unmatch release-payload
          else echo "payload already applied"; fi
      - name: Server tests
        run: cd server && node --test test/*.test.js
      - name: Commit release source
        run: |
          git config user.name gamal-hametzaits
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A android server
          git reset -q android/local.properties || true
          git diff --cached --quiet || git commit -m "v$(grep -oP "versionName '\K[^']+" android/app/build.gradle): fade changes every 30 minutes"
          git push
      - name: Load retained private signing key
        if: ${{ github.event.inputs.publish != 'false' }}
        env:
          GH_TOKEN: ${{ secrets.ECHOTRACE_BUILD_TOKEN }}
        run: |
          gh api repos/gamal-hametzaits/echotrace-signing-key/contents/echotrace.keystore --jq .content | base64 -d > "$RUNNER_TEMP/echotrace.keystore"
      - name: Test and build signed update
        if: ${{ github.event.inputs.publish != 'false' }}
        env:
          ECHOTRACE_KEYSTORE: ${{ runner.temp }}/echotrace.keystore
          ECHOTRACE_STORE_PASSWORD: ${{ secrets.ECHOTRACE_SIGNING_PASSWORD }}
          ECHOTRACE_KEY_PASSWORD: ${{ secrets.ECHOTRACE_SIGNING_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleRelease --no-daemon
      - name: Verify signer matches v1.0.17 before publishing
        if: ${{ github.event.inputs.publish != 'false' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          AS="$ANDROID_HOME/build-tools/33.0.2/apksigner"
          gh release download v1.0.17 --pattern 'EchoTrace-v1.0.17.apk' --dir /tmp/old
          NEW=$($AS verify --print-certs android/app/build/outputs/apk/release/app-release.apk | grep 'certificate SHA-256 digest' | head -1)
          OLD=$($AS verify --print-certs /tmp/old/EchoTrace-v1.0.17.apk | grep 'certificate SHA-256 digest' | head -1)
          echo "new: $NEW"; echo "old: $OLD"
          test -n "$NEW" && test "$NEW" = "$OLD"
      - name: Publish APK and rename-friendly download
        if: ${{ github.event.inputs.publish != 'false' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(grep -oP "versionName '\K[^']+" android/app/build.gradle)
          cp android/app/build/outputs/apk/release/app-release.apk "EchoTrace-v$V.apk"
          cp "EchoTrace-v$V.apk" "EchoTrace-v$V.apk.txt"
          gh release create "v$V" "EchoTrace-v$V.apk" "EchoTrace-v$V.apk.txt" --title "EchoTrace v$V" --notes 'The photo fade now changes every 30 minutes (48 steps over 24 hours) in the widget and the wallpaper. Same signing key, installs over 1.0.17, 1.1.0 and 1.2.0.'
      - uses: actions/upload-artifact@v4
        if: ${{ always() && github.event.inputs.publish != 'false' }}
        with:
          name: tests-and-build
          path: |
            android/app/build/reports/tests/
            android/app/build/outputs/apk/release/
