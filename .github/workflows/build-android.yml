name: Build signed EchoTrace Android
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Apply reviewed Android UX source
        run: |
          unzip -o ux-source.zip
          python3 scripts/ui_audit.py
          git config user.name gamal-hametzaits
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add android
          git diff --cached --quiet || git commit -m "v1.0.16: truthful pairing, sync and receive states"
          git push
      - name: Load retained private signing key
        env:
          GH_TOKEN: ${{ secrets.ECHOTRACE_BUILD_TOKEN }}
        run: |
          gh api repos/gamal-hametzaits/echotrace-signing-key/contents/echotrace.keystore --jq .content | base64 -d > "$RUNNER_TEMP/echotrace.keystore"
      - name: Test and build signed update
        env:
          ECHOTRACE_KEYSTORE: ${{ runner.temp }}/echotrace.keystore
          ECHOTRACE_STORE_PASSWORD: ${{ secrets.ECHOTRACE_SIGNING_PASSWORD }}
          ECHOTRACE_KEY_PASSWORD: ${{ secrets.ECHOTRACE_SIGNING_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleRelease --no-daemon
      - name: Publish APK and rename-friendly download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk EchoTrace-v1.0.16.apk
          cp EchoTrace-v1.0.16.apk EchoTrace-v1.0.16.apk.txt
          gh release create v1.0.16 EchoTrace-v1.0.16.apk EchoTrace-v1.0.16.apk.txt --title 'EchoTrace v1.0.16 - connection clarity' --notes 'Hebrew UX update: code copy, pending pairing vs verified connection, manual sync check, recent local receipt, upload accepted by server rather than delivered claim. Same retained signing key. Android background delivery is still subject to WorkManager delays. No server changes.'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-and-build
          path: |
            android/app/build/reports/tests/
            android/app/build/outputs/apk/release/
