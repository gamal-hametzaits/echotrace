name: Build signed EchoTrace Android
on:
  push:
    branches: [main]
    paths: ['android/**']
  workflow_dispatch:
concurrency:
  group: echotrace-build
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Prepare installed Android SDK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-33" "build-tools;33.0.2"
      - name: Server tests
        run: cd server && node --test test/*.test.js
      - name: Load signing key
        env:
          KS_B64: ${{ secrets.ECHOTRACE_KEYSTORE_B64 }}
          GH_TOKEN: ${{ secrets.ECHOTRACE_BUILD_TOKEN }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/echotrace.keystore"
            echo "signing key source: protected Actions secret"
          else
            gh api repos/oz-lev/echotrace-signing-key/contents/echotrace.keystore --jq .content | base64 -d > "$RUNNER_TEMP/echotrace.keystore"
            echo "signing key source: private key repo (fallback)"
          fi
      - name: Test and build signed APK
        env:
          ECHOTRACE_KEYSTORE: ${{ runner.temp }}/echotrace.keystore
          ECHOTRACE_STORE_PASSWORD: ${{ secrets.ECHOTRACE_SIGNING_PASSWORD }}
          ECHOTRACE_KEY_PASSWORD: ${{ secrets.ECHOTRACE_SIGNING_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleRelease --no-daemon
      - name: Verify signer matches v1.0.17 before publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          AS="$ANDROID_HOME/build-tools/33.0.2/apksigner"
          gh release download v1.0.17 --pattern 'EchoTrace-v1.0.17.apk' --dir /tmp/old
          NEW=$($AS verify --print-certs android/app/build/outputs/apk/release/app-release.apk | grep 'certificate SHA-256 digest' | head -1)
          OLD=$($AS verify --print-certs /tmp/old/EchoTrace-v1.0.17.apk | grep 'certificate SHA-256 digest' | head -1)
          echo "new: $NEW"; echo "old: $OLD"
          test -n "$NEW" && test "$NEW" = "$OLD"
      - name: Publish APK (new version = release, same version = durable build prerelease)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(grep -oP "versionName '\K[^']+" android/app/build.gradle)
          SHORT=$(git rev-parse --short HEAD)
          if gh release view "v$V" >/dev/null 2>&1; then
            TAG="v$V-build.${{ github.run_number }}"
            N="EchoTrace-v$V-build.${{ github.run_number }}"
            cp android/app/build/outputs/apk/release/app-release.apk "$N.apk"
            cp "$N.apk" "$N.apk.txt"
            SUM=$(sha256sum "$N.apk" | cut -d' ' -f1); echo "$SUM  $N.apk" > "$N.sha256"
            gh release create "$TAG" "$N.apk" "$N.apk.txt" "$N.sha256" --target "${{ github.sha }}" --prerelease --title "EchoTrace v$V build ${{ github.run_number }} ($SHORT)" --notes "Automatic backup of the signed APK built from commit ${{ github.sha }}. Same signing key as v1.0.17. SHA-256 of the APK: $SUM. Rolling backup: only the newest 10 build prereleases are kept; product releases are never removed."
            gh release download "$TAG" --pattern "$N.apk" --dir /tmp/chk-dl
            test "$(sha256sum /tmp/chk-dl/$N.apk | cut -d' ' -f1)" = "$SUM"
            for old in $(gh release list --limit 100 --json tagName --jq '.[].tagName' | grep -E '^v.+-build\.[0-9]+$' | sort -t. -k4 -n -r | tail -n +11); do
              gh release delete "$old" --cleanup-tag --yes
            done
          else
            cp android/app/build/outputs/apk/release/app-release.apk "EchoTrace-v$V.apk"
            cp "EchoTrace-v$V.apk" "EchoTrace-v$V.apk.txt"
            SUM=$(sha256sum "EchoTrace-v$V.apk" | cut -d' ' -f1); echo "$SUM  EchoTrace-v$V.apk" > "EchoTrace-v$V.sha256"
            gh release create "v$V" "EchoTrace-v$V.apk" "EchoTrace-v$V.apk.txt" "EchoTrace-v$V.sha256" --target "${{ github.sha }}" --title "EchoTrace v$V" --notes "Signed APK built automatically from commit ${{ github.sha }}. Same signing key, installs over 1.0.17 and later. SHA-256 of the APK: $SUM."
            gh release download "v$V" --pattern "EchoTrace-v$V.apk" --dir /tmp/chk-dl
            test "$(sha256sum /tmp/chk-dl/EchoTrace-v$V.apk | cut -d' ' -f1)" = "$SUM"
          fi
